<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="frappe-csrf-token" content="{{ csrf_token }}" />
    <meta name="description" content="Internal Rating Survey Dashboard — Premium Employee Feedback Portal" />
    <title>Internal Rating Survey</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Built Vue assets (generated by Vite) -->
    <link rel="stylesheet" href="/assets/internal_rating_survey/frontend/index.css" />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const theme = savedTheme || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- Vue app mount point -->
    <div id="app"></div>

    <!-- Inject Frappe session data for the Vue app -->
    <script>
      window.frappe_user = "{{ user }}";
    </script>

    <!-- Vue app entry bundle -->
    <script type="module" src="/assets/internal_rating_survey/frontend/index.js"></script>
  </body>
</html>
