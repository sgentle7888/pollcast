<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="frappe-csrf-token" content="{{ csrf_token }}" />
    <meta name="description" content="Pollcast — Premium Poll & Survey Platform powered by Frappe" />
    <title>Pollcast</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Built Vue assets (generated by Vite) -->
    <link rel="stylesheet" href="/assets/pollcast/frontend/index.css" />

    <!-- Theme init: no flash of wrong theme -->
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- Vue app mount point -->
    <div id="app"></div>

    <!-- Inject Frappe session data -->
    <script>
      window.frappe_user = "{{ user }}";
      window.frappe_csrf_token = "{{ csrf_token }}";
      window.pollcast_company_logo = "{{ company_logo }}";
    </script>

    <!-- Vue app entry bundle -->
    <script type="module" src="/assets/pollcast/frontend/index.js"></script>
  </body>
</html>
