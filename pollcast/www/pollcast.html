<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="frappe-csrf-token" content="{{ csrf_token }}" />
    <meta
      name="description"
      content="Pollcast — Premium Poll & Survey Platform powered by Frappe"
    />
    <title>Pollcast</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a slow/blocked Google Fonts must never delay the app -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Built Vue assets (generated by Vite) -->
    <link
      rel="stylesheet"
      href="/assets/pollcast/frontend/index.css?v={{ asset_version }}"
    />

    <!-- Theme init: no flash of wrong theme -->
    <script>
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("theme") || "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <!-- Vue app mount point -->
    <div id="app"></div>

    <!-- Inject Frappe session data -->
    <script>
      window.frappe_user = {{ user | tojson }};
      window.frappe_csrf_token = {{ csrf_token | tojson }};
      window.pollcast_company_logo = {{ company_logo | tojson }};
      window.pollcast_company_name = {{ company_name | tojson }};
    </script>

    <!-- Boot watchdog (plain ES5 so it runs even on old browsers).
         - ?debug=1 prints any script/CSS load or runtime error on screen.
         - If the app has not mounted after 10s, shows a Reload message. -->
    <script>
      (function () {
        var debug = /[?&]debug=1/.test(location.search);
        var box;
        function show(html, bg) {
          if (!box) {
            box = document.createElement("div");
            box.style.cssText =
              "position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:14px 16px;" +
              "font:13px/1.5 system-ui,sans-serif;word-break:break-word;color:#fff;background:" +
              (bg || "#7f1d1d");
            document.body.appendChild(box);
          }
          box.innerHTML += html;
        }
        function esc(t) {
          return String(t).replace(/[&<>]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
          });
        }
        if (debug) {
          window.addEventListener(
            "error",
            function (e) {
              var t = e.target && (e.target.src || e.target.href);
              show(
                "<div>" +
                  (t
                    ? "FAILED TO LOAD: " + esc(t)
                    : "ERROR: " +
                      esc(e.message) +
                      " (" +
                      esc(e.filename || "") +
                      ":" +
                      (e.lineno || "") +
                      ")") +
                  "</div>",
              );
            },
            true,
          );
        }
        setTimeout(function () {
          var app = document.getElementById("app");
          if (app && !app.children.length) {
            show(
              "<div>This page is taking too long to load. Check your connection, then " +
                '<a href="" style="color:#fff;font-weight:700" onclick="location.reload();return false">reload</a>.</div>',
              "#1e3a8a",
            );
          }
        }, 10000);
      })();
    </script>

    <!-- Vue app entry bundle -->
    <script
      type="module"
      src="/assets/pollcast/frontend/index.js?v={{ asset_version }}"
    ></script>
    <script nomodule>
      document.body.insertAdjacentHTML(
        "beforeend",
        '<p style="padding:2rem;font-family:system-ui,sans-serif">Your browser is too old to open this page. Please update it or open the link in Chrome.</p>',
      );
    </script>
  </body>
</html>
